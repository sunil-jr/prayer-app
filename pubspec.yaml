name: sg
description: SoulGrace — a minimalist prayer and spiritual wellness app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  uuid: ^4.3.3
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  share_plus: ^9.0.0
  timezone: ^0.9.4
  purchases_flutter: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.3.9

flutter_native_splash:
  color: "#FAF7F2"
  android: true
  ios: true
  web: false
  android_12:
    color: "#FAF7F2"

flutter:
  uses-material-design: true
